name: Bug Report
description: Report a problem with Chouette
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: When I tried to translate a page in Spanish, the popup showed "Idle" and nothing happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup
        2. Select source language "Spanish", target "English"
        3. Click Translate
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 131"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.3"
    validations:
      required: true
